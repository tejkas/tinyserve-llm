[project]
name = "tinyserve-llm"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "torch >= 2.0",
]

[project.optional-dependencies]
# flash-attn is CUDA-only; the allocator and the PyTorch reference run without it.
# Install with: pip install -e ".[cuda]" --no-build-isolation
cuda = [
    "flash-attn >= 2.6",
    "triton >= 2.1",
]
dev = [
    "pytest >= 7.0",
    "pytest-benchmark",
    "numpy",
]

[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyserve_llm*"]
