[project]
name = "kv-cache-manager"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "torch >= 2.0",
    "triton >= 2.1"
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-benchmark"
]

[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.backends._legacy:_Backend"