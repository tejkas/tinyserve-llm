[project]
name = "tinyserve-llm"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = [
    "torch >= 2.0",
    "safetensors",
    "transformers >= 5.0",
]

[project.optional-dependencies]
# flash-attn is CUDA-only; the KV cache manager and the PyTorch reference run without it.
# On the cluster use scripts/gpu_setup.sh: it pins torch 2.8 and installs flash-attn's prebuilt wheel,
# since installing this extra directly compiles flash-attn from source.
cuda = [
    "flash-attn >= 2.6",
    "triton >= 2.1",
]
dev = [
    "pytest >= 7.0",
    "pytest-benchmark",
    "numpy",
]

[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tinyserve_llm*"]
